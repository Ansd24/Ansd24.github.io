<section id="hero" style="background-color: var(--tf-page-bg-color)" class="bg-gradient hero-section">
  <div class="hero-glow" aria-hidden="true"></div>

  <div class="hero-grid">
    <div class="hero-left">
      <div class="hero-status hero-line">
        <span class="hero-status__dot" aria-hidden="true"></span>
        <span class="hero-status__text">MSc Cybersecurity &middot; Open to SOC Opportunities</span>
      </div>

      <h1 class="hero-headline">
        <span class="hero-headline__word hero-line">Detect.</span>
        <span class="hero-headline__word hero-line">Protect.</span>
        <span class="hero-headline__word hero-headline__word--accent hero-line">Understand.</span>
      </h1>

      <p class="hero-tagline hero-line">
        MSc Cybersecurity student focused on detection, threat analysis, and building security tooling.
        I care about understanding how things work &mdash; and how they break.
      </p>
    </div>

    <div class="hero-right">
      <div class="hero-photo-wrap hero-line">
        <img src="{{ site.data.bio.basics.picture }}" class="hero-photo"
             alt="{{ site.data.bio.basics.name }}" width="480" height="600">
      </div>

      <div class="hero-stats hero-line">
        <div class="hero-stat">
          <span class="hero-stat__value">4+</span>
          <span class="hero-stat__label">Projects Built</span>
        </div>
        <div class="hero-stat">
          <span class="hero-stat__value">SOC L1</span>
          <span class="hero-stat__label">THM Path</span>
        </div>
        <div class="hero-stat">
          <span class="hero-stat__value">3+</span>
          <span class="hero-stat__label">Lab Networks</span>
        </div>
      </div>
    </div>
  </div>

  <div class="scroll-indicator" aria-hidden="true">
    <span class="scroll-indicator__mouse"></span>
  </div>
</section>
